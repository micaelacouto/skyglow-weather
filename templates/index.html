<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyGlow - Clima em Tempo Real</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Fundo dinâmico para as animações (sol, nuvens, chuva) -->
    <div id="weather-bg"></div>

    <div class="container">
        <h1>SkyGlow</h1>
        <p class="subtitle">Descubra o clima em qualquer lugar</p>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Digite a cidade...">
            <button id="searchBtn">Buscar</button>
        </div>

        <div id="weatherResult" class="weather-card">
            <h2 id="cityName">--</h2>
            <div class="temp-container">
                <span id="temperature">--°C</span>
            </div>
            <div class="details">
                <p id="wind">Vento: -- km/h</p>
                <p id="status">Status: --</p>
            </div>
        </div>

        <footer>
            <p>Desenvolvido por <strong>Micaela</strong> | <a href="https://github.com/micaelacouto" target="_blank" rel="noopener noreferrer">Perfil no GitHub</a></p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
