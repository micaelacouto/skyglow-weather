<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyGlow - Previsão do Tempo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>SkyGlow 🌤️</h1>
        <p class="subtitle">Consulte a previsão do tempo</p>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Digite a cidade...">
            <button id="searchBtn">Buscar</button>
        </div>

        <div id="weatherResult" class="weather-card">
            <h2 id="cityName">--</h2>
            <div class="temp-container">
                <span id="temperature">--°C</span>
            </div>
            <p id="description">Digite uma cidade para consultar o clima.</p>
        </div>
    </div>

    <footer style="margin-top: 40px; text-align: center; padding: 20px; font-family: sans-serif; color: #555;">
        <p>Desenvolvido por <strong>Micaela</strong> | <a href="https://github.com/micaelacouto" target="_blank" rel="noopener noreferrer" style="color: #007bff; text-decoration: none;">Perfil no GitHub</a></p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
